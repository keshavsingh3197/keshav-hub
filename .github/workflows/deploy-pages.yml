name: Deploy Keshav Ecosystem Hub to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OUTPUT_DIR: dist/keshav-hub/browser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Generate sitemap and build static SSG site
        run: npm run build

      - name: Configure custom apex domain CNAME
        run: echo "keshavsingh.in" > ${{ env.OUTPUT_DIR }}/CNAME

      - name: Ensure SPA / 404 fallback and bypass Jekyll
        run: |
          if [ -f "${{ env.OUTPUT_DIR }}/404/index.html" ]; then
            cp "${{ env.OUTPUT_DIR }}/404/index.html" "${{ env.OUTPUT_DIR }}/404.html"
          else
            cp "${{ env.OUTPUT_DIR }}/index.html" "${{ env.OUTPUT_DIR }}/404.html"
          fi
          touch "${{ env.OUTPUT_DIR }}/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
